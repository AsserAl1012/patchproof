name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run security:check
      - run: npm run production:check
      - run: npm run release:check
      - run: npm test
      - run: npm run smoke
      - name: Validate local GitHub Action
        run: node bin/patchproof.js run --scenario clamp-range --out certificate.json
      - uses: ./
        with:
          certificate: certificate.json
      - run: npm pack --dry-run

  integration-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patchproof
          POSTGRES_PASSWORD: patchproof
          POSTGRES_DB: patchproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchproof"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Run Postgres migrations
        env:
          PATCHPROOF_STORE_DRIVER: postgres
          DATABASE_URL: postgres://patchproof:patchproof@127.0.0.1:5432/patchproof
        run: npm run migrate
      - name: Validate Redis queue backend
        env:
          PATCHPROOF_QUEUE_DRIVER: redis
          PATCHPROOF_REDIS_URL: redis://127.0.0.1:6379
        run: |
          node --input-type=module <<'NODE'
          import { createJobQueue } from "./saas/queue.js";
          const queue = createJobQueue();
          await queue.connect();
          await queue.enqueue({ jobId: "job_ci", runId: "run_ci" });
          const claimed = await queue.claim({ timeoutSeconds: 1 });
          if (!claimed?.leaseId) throw new Error("Redis queue did not return a leased payload.");
          await queue.ack(claimed);
          await queue.close?.();
          NODE
      - name: Build Docker runner image
        run: docker build -t patchproof:ci .
      - name: Start MinIO
        run: |
          docker run -d --name patchproof-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=patchproof \
            -e MINIO_ROOT_PASSWORD=patchproof-password \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in {1..30}; do
            if node -e "fetch('http://127.0.0.1:9000/minio/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          docker logs patchproof-minio
          exit 1
      - name: Run service-backed Docker runner integration
        env:
          PATCHPROOF_STORE_DRIVER: postgres
          DATABASE_URL: postgres://patchproof:patchproof@127.0.0.1:5432/patchproof
          PATCHPROOF_QUEUE_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          PATCHPROOF_ARTIFACT_DRIVER: s3
          PATCHPROOF_S3_ENDPOINT: http://127.0.0.1:9000
          PATCHPROOF_S3_BUCKET: patchproof
          PATCHPROOF_S3_ACCESS_KEY_ID: patchproof
          PATCHPROOF_S3_SECRET_ACCESS_KEY: patchproof-password
          PATCHPROOF_S3_FORCE_PATH_STYLE: "true"
          PATCHPROOF_RUNNER_IMAGE: patchproof:ci
        run: npm run integration:services
