name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - run: npm test
      - run: npm run smoke
      - name: Validate local GitHub Action
        run: node bin/patchproof.js run --scenario clamp-range --out certificate.json
      - uses: ./
        with:
          certificate: certificate.json
      - run: npm pack --dry-run
