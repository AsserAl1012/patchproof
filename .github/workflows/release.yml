name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the npm package after validation.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - run: npm test
      - run: npm run smoke
      - name: Validate versioned GitHub Action
        run: node bin/patchproof.js run --scenario clamp-range --out certificate.json
      - uses: ./
        with:
          certificate: certificate.json
      - name: Build Docker image
        run: docker build -t patchproof:${{ github.ref_name }} .
      - name: Pack npm artifact
        run: npm pack --json > npm-pack.json
      - name: Generate SBOM
        run: npm sbom --sbom-format spdx --json > sbom.spdx.json
      - name: Generate checksums
        shell: bash
        run: |
          PACKAGE_FILE="$(node -e "console.log(require('./npm-pack.json')[0].filename)")"
          sha256sum "$PACKAGE_FILE" sbom.spdx.json certificate.json > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: patchproof-release-${{ github.ref_name }}
          path: |
            *.tgz
            npm-pack.json
            sbom.spdx.json
            checksums.txt
            certificate.json
      - name: Attach release artifacts
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            sbom.spdx.json
            checksums.txt
            certificate.json
      - name: Publish npm package
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set the NPM_TOKEN repository secret before publishing."
            exit 1
          fi
          npm publish --access public --provenance
